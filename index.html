<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indeks USC Stare Siołkowice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: rzeczowy, archiwalny – narzędzie do pracy
   IDEA: drukowany formularz Standesamtu – rubryki i zakładki ksiąg U/M/Z
   PICTURE: formularz wyszukiwania jak rubryka, wyniki jak tabela rejestru
   COLOUR and TYPE: biały papier, atrament #1b2230, zieleń formularzy #1f5c4a; Archivo Narrow + Archivo
   LAYOUT: jedna kolumna do 1100px: zakładki, formularz, tabela, stan indeksu */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#12161d);--ink:light-dark(#1b2230,#e7eaef);--mute:light-dark(#5d6573,#9aa3b2);--line:light-dark(#d9dde3,#2c3440);--acc:light-dark(#1f5c4a,#6fc1a5);--acc2:light-dark(#e8f1ee,#1b2a26);--warn:light-dark(#a1462b,#f0a184);--card:light-dark(#fafbfc,#171c24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px)}
h1{font:700 clamp(30px,5vw,44px)/1.05 "Archivo Narrow",sans-serif;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 24px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink)}
.tab{flex:1;font:700 16px "Archivo Narrow",sans-serif;min-height:48px;padding:0 12px;border:2px solid var(--ink);border-bottom:0;background:var(--bg);color:var(--ink);cursor:pointer;margin-right:-2px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
form{border:2px solid var(--ink);border-top:0;padding:18px;display:grid;gap:14px;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}
label{display:flex;flex-direction:column;gap:4px;font:500 13px "Archivo Narrow",sans-serif;color:var(--mute)}
input[type=text]{font:16px Archivo,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dotted var(--ink);padding:8px 2px;min-height:44px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink);min-height:44px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.sp{flex:1}
button{font:600 15px Archivo,sans-serif;min-height:44px;padding:0 22px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button:disabled{opacity:.4;cursor:default}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:22px 0 10px;color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:700 13px "Archivo Narrow",sans-serif;text-align:left;color:var(--mute);border-bottom:2px solid var(--ink);padding:8px 8px;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th.grp{text-align:center;border-bottom:1px solid var(--line)}
td.sep,th.sep{border-left:2px solid var(--line)}
tr.hit td.h{background:var(--acc2)}
.q{color:var(--warn);font-size:12px;white-space:nowrap}
.empty{padding:28px;border:1px dashed var(--line);color:var(--mute);text-align:center}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0;flex-wrap:wrap}
.cov{margin-top:40px;border-top:2px solid var(--ink);padding-top:18px}
.cov h2{font:700 22px "Archivo Narrow",sans-serif;margin:0 0 12px}
.covrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0;font-size:14px}
.yrs{display:flex;flex-wrap:wrap;gap:3px}
.yr{width:12px;height:18px;background:var(--line)}.yr.on{background:var(--acc)}
.legend{color:var(--mute);font-size:13px;margin-top:10px}
@media(max-width:700px){form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}form label:first-child{grid-column:1/-1}.tab{font-size:14px;padding:0 6px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}td.sep{border-left:0}}
</style>
</head>
<body>
<div class="wrap">
<h1>Standesamt Alt Schalkowitz – indeks aktów</h1>
<p class="sub">USC Stare Siołkowice · nazwiska w pisowni z aktów</p>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-t="U" aria-selected="true">U – urodzenia</button>
  <button class="tab" role="tab" data-t="M" aria-selected="false">M – małżeństwa</button>
  <button class="tab" role="tab" data-t="Z" aria-selected="false">Z – zgony</button>
</div>
<form id="f" autocomplete="off">
  <label>Nazwisko<input type="text" id="qn"></label>
  <label>Imię<input type="text" id="qi"></label>
  <label>Rok od<input type="text" id="y1" inputmode="numeric" maxlength="4"></label>
  <label>Rok do<input type="text" id="y2" inputmode="numeric" maxlength="4"></label>
  <div class="row2">
    <label class="chk"><input type="checkbox" id="par">szukaj też wśród rodziców</label>
    <span class="sp"></span>
    <button type="button" class="ghost" id="clr">Wyczyść</button>
    <button type="submit">Szukaj</button>
  </div>
</form>

<div class="meta"><span id="cnt">Ładowanie indeksu…</span><span>Szukanie toleruje pisownię: Kokot = Kokott, Wosch = Woś</span></div>
<div id="res"></div>
<div class="pager" id="pg"></div>

<section class="cov">
  <h2>Stan indeksu</h2>
  <div id="cov"></div>
  <p class="legend">Zielone pole = rocznik przerobiony. <span class="q">[?]</span> = niepewny odczyt – sprawdź na skanie. „z d.” = z domu (geborene).</p>
</section>
</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYP={U:'Urodzenia',M:'Małżeństwa',Z:'Zgony'};
const RANGE={U:[1874,1915],M:[1874,1935],Z:[1874,1935]};
const PER=100;
let D=[],T='U',RES=[],page=0;

function norm(s){
  s=String(s||'').toLowerCase().replace(/\[\?\]/g,'').replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
  return s.replace(/sch/g,'s').replace(/sz/g,'s').replace(/tz/g,'c').replace(/cz/g,'c').replace(/ck/g,'k').replace(/th/g,'t').replace(/ph/g,'f')
          .replace(/w/g,'v').replace(/y/g,'i').replace(/j/g,'i').replace(/(.)\1+/g,'$1');
}
const variants=s=>String(s||'').replace(/\[\?\]/g,'').split(/\(|\)|\bz d\.|,/).map(norm).filter(Boolean);
const maiden=s=>{const m=String(s||'').match(/z d\.\s*([^)\]]+)/);return m?m[1].trim():null};
const baseName=s=>String(s||'').replace(/\s*\(.*$/,'').replace(/\s*z d\..*$/,'').trim();
const cell=s=>{const t=String(s||'');return esc(t.replace(/\s*\[\?\]/g,''))+(/\[\?\]/.test(t)?' <span class="q">[?]</span>':'')};

// persons: [glowna, imie, nazwisko]
function persons(d){
  const L=[];const add=(g,im,naz)=>{if(im||naz)L.push({g,ni:String(im||'').split(/\s+/).map(norm),nv:variants(naz)})};
  if(d.t==='U'){add(1,d.i,d.n);if(d.o)add(0,d.o,baseName(d.n));add(0,d.mi,d.mn)}
  if(d.t==='M'){add(1,d.pi,d.pn);if(d.po)add(0,d.po,maiden(d.pn)||d.pn);add(0,d.pmi,d.pmn);add(1,d.ki,d.kn);if(d.ko)add(0,d.ko,maiden(d.kn)||d.kn);add(0,d.kmi,d.kmn)}
  if(d.t==='Z'&&d.i){add(1,d.i,d.n);if(d.o&&!/^\[/.test(d.o))add(0,d.o,maiden(d.n)||d.n);if(d.mi)add(0,d.mi,d.mn)}
  return L;
}

const HEAD={
 U:`<tr><th>Rok</th><th>Akt</th><th>Imię</th><th>Nazwisko</th><th class="sep">Imię ojca</th><th>Imię matki</th><th>Nazwisko matki</th></tr>`,
 M:`<tr><th rowspan="2">Rok</th><th rowspan="2">Akt</th><th colspan="5" class="grp">Pan młody</th><th colspan="5" class="grp sep">Panna młoda</th></tr>
    <tr><th>Imię</th><th>Nazwisko</th><th>Ojciec</th><th>Imię matki</th><th>Nazwisko matki</th><th class="sep">Imię</th><th>Nazwisko</th><th>Ojciec</th><th>Imię matki</th><th>Nazwisko matki</th></tr>`,
 Z:`<tr><th>Rok</th><th>Akt</th><th>Imię</th><th>Nazwisko</th><th class="sep">Imię ojca</th><th>Imię matki</th><th>Nazwisko matki</th></tr>`};
const LAB={U:['Rok','Akt','Imię','Nazwisko','Imię ojca','Imię matki','Nazwisko matki'],
 M:['Rok','Akt','Pan – imię','Pan – nazwisko','Pan – ojciec','Pan – imię matki','Pan – nazw. matki','Panna – imię','Panna – nazwisko','Panna – ojciec','Panna – imię matki','Panna – nazw. matki'],
 Z:['Rok','Akt','Imię','Nazwisko','Imię ojca','Imię matki','Nazwisko matki']};
function row(d){
  let c;
  if(d.t==='U')c=[d.r,d.a,d.i,d.n,d.o,d.mi,d.mn];
  if(d.t==='M')c=[d.r,d.a,d.pi,d.pn,d.po,d.pmi,d.pmn,d.ki,d.kn,d.ko,d.kmi,d.kmn];
  if(d.t==='Z')c=[d.r,d.a,d.i,d.n,d.o,d.mi,d.mn];
  const sepAt={U:[4],M:[7],Z:[4]}[d.t];const L=LAB[d.t];
  return '<tr>'+c.map((v,i)=>`<td data-l="${L[i]}" class="${i<2?'n':''}${sepAt.includes(i)?' sep':''}">${cell(v)}</td>`).join('')+'</tr>';
}

function search(){
  const qn=norm($('qn').value),qi=norm($('qi').value);
  const y1=+$('y1').value||0,y2=+$('y2').value||9999,par=$('par').checked;
  RES=D.filter(d=>{
    if(d.t!==T||d.r<y1||d.r>y2||d.x)return false;
    if(!qn&&!qi)return true;
    return d._p.some(p=>(par||p.g)&&(!qn||p.nv.some(v=>v.startsWith(qn)))&&(!qi||p.ni.some(w=>w.startsWith(qi))));
  });
  page=0;show();
}
function show(){
  const n=RES.length,pages=Math.ceil(n/PER);
  $('cnt').textContent=n?`${TYP[T]}: ${n} ${n===1?'akt':'aktów'}${pages>1?` · strona ${page+1} z ${pages}`:''}`:`${TYP[T]}: brak wyników w przerobionych rocznikach.`;
  $('res').innerHTML=n?`<div class="scroll"><table class="stack"><thead>${HEAD[T]}</thead><tbody>${RES.slice(page*PER,(page+1)*PER).map(row).join('')}</tbody></table></div>`
    :'<div class="empty">Brak wyników. Sprawdź w „Stanie indeksu”, czy szukany rocznik jest już przerobiony.</div>';
  $('pg').innerHTML=pages>1?`<button type="button" class="ghost" id="prev" ${page?'':'disabled'}>← Poprzednie</button><span>${page+1} / ${pages}</span><button type="button" class="ghost" id="next" ${page<pages-1?'':'disabled'}>Następne →</button>`:'';
}
$('pg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;page+=b.id==='next'?1:-1;show();$('cnt').scrollIntoView()});

function coverage(){
  $('cov').innerHTML=['U','M','Z'].map(t=>{
    const ys=new Set(D.filter(d=>d.t===t).map(d=>d.r));const n=D.filter(d=>d.t===t&&!d.x).length;const [a,b]=RANGE[t];
    let cells='';for(let y=a;y<=b;y++)cells+=`<span class="yr${ys.has(y)?' on':''}" title="${y}"></span>`;
    return `<div class="covrow"><div><b>${t}</b> ${a}–${b}<br><small>${n} akt. · roczniki: ${[...ys].sort().join(', ')||'brak'}</small></div><div class="yrs">${cells}</div></div>`}).join('');
}
function idle(){$('res').innerHTML='';$('pg').innerHTML='';$('cnt').textContent=`${TYP[T]}: ${D.filter(d=>d.t===T&&!d.x).length} aktów w indeksie. Kliknij Szukaj.`}

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
  T=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));idle()});
$('f').addEventListener('submit',e=>{e.preventDefault();search()});
$('clr').onclick=()=>{$('f').reset();idle();$('qn').focus()};

fetch('dane.json').then(r=>r.json()).then(data=>{D=data;for(const d of D)d._p=persons(d);coverage();idle()})
  .catch(()=>{$('cnt').textContent='Nie udało się wczytać pliku dane.json.'});
}
</script>
</body>
</html>
